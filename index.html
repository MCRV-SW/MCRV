<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCRV – More Creativity, Real Vision</title>
<meta name="description" content="MCRV – More Creativity, Real Vision. T-shirts och hoodies.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='%23fff' font-family='serif' font-weight='bold'%3EM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#F5F5F5; --grey:#8C8C8C; --line:#262626; --card:#111; --frost:#BCD6E8;
    --display:"Cinzel","Trajan Pro","Times New Roman",serif;
    --body:"DM Sans","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--body);background:#000;color:var(--white);line-height:1.5;font-size:1.05rem}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--frost);outline-offset:3px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 1.25rem}

  /* Startsida */
  .hero{min-height:92svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2rem;padding:3rem 1.25rem}
  .hero img{width:min(100%,980px);height:auto;display:block;animation:fade 1.2s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
  .hero p{font-family:var(--display);font-weight:600;font-size:clamp(1.1rem,2.6vw,1.6rem);color:#cfcfcf}
  .btn{display:inline-block;background:var(--white);color:#000;font:700 1rem var(--body);padding:.9rem 2rem;border:0;border-radius:4px;text-decoration:none;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--frost)}

  /* Kläder */
  .shop{padding:2rem 0 5rem}
  h2{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,3rem);margin-bottom:2rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.5rem}
  .card{background:var(--card);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
  .art{background:#E4E4E4;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
  .art svg,.art img{display:block;width:100%;height:100%;object-fit:contain}
  .art svg{padding:8%}
  .info{padding:1.1rem 1.2rem 1.3rem;display:flex;flex-direction:column;gap:1rem;flex:1}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
  .name{font-weight:700;font-size:1.15rem}
  .price{color:#cfcfcf}
  .label{font-size:.85rem;color:var(--grey);margin-bottom:.4rem}
  .sizes{display:flex;gap:.4rem;flex-wrap:wrap}
  .size{min-width:3rem;padding:.4rem .5rem;font:500 .95rem var(--body);color:var(--white);border:1px solid #444;background:transparent;border-radius:4px;cursor:pointer}
  .size:hover{border-color:var(--white)}
  .size[aria-pressed="true"]{background:var(--white);color:#000;border-color:var(--white)}
  .buy{margin-top:auto;width:100%}
  .note{margin-top:2rem;color:var(--grey);font-size:.95rem;max-width:60ch}

  footer{border-top:1px solid var(--line);padding:3rem 0 2rem}
  .foot{display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:space-between;align-items:flex-end}
  .foot img{height:44px;width:auto;display:block;margin-bottom:.6rem}
  .foot p{color:#cfcfcf}
  .small{margin-top:2rem;font-size:.85rem;color:var(--grey)}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .hero img{animation:none}
    .btn{transition:none}
  }
</style>
</head>
<body>

<header class="hero">
  <h1 style="position:absolute;left:-9999px">MCRV</h1>
  <img class="logo-img" alt="MCRV">
  <p>More Creativity, Real Vision.</p>
  <a class="btn" href="#kollektion">Se kläderna</a>
</header>

<main>
  <section class="shop" id="kollektion">
    <div class="wrap">
      <h2>Kläder</h2>
      <div class="grid" id="grid"></div>
      <p class="note">Tryck på Beställ så öppnas ett färdigt mejl till oss. Vi svarar med betalning och leverans. Är du under 18, be en vårdnadshavare hjälpa dig.</p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div>
        <img class="logo-img" alt="MCRV">
        <p>More Creativity, Real Vision.</p>
      </div>
      <div>
        <p><a id="mail" href="#">mejl</a></p>
        <p><a id="insta" href="#" target="_blank" rel="noopener">Instagram</a></p>
      </div>
    </div>
    <p class="small">© <span id="year"></span> MCRV</p>
  </div>
</footer>

  document.querySelectorAll(".logo-img").forEach(i => i.src = LOGO);
  document.getElementById("defs").insertAdjacentHTML("beforeend",
    `<symbol id="lg" viewBox="0 0 900 157"><image href="${LOGO}" width="900" height="157"/></symbol>`);

  const TEE = "M88 40 L106 31 Q120 48 134 31 L152 40 L204 72 L186 110 L164 97 L164 208 L76 208 L76 97 L54 110 L36 72 Z";
  const HOODIE = "M90 40 Q120 12 150 40 L182 48 L224 86 L216 180 L186 176 L184 216 L56 216 L54 176 L24 180 L16 86 L58 48 Z";

  function art(p){
    if (p.img) return `<img src="${p.img}" alt="${p.name}">`;
    const line = p.dark ? "rgba(255,255,255,.16)" : "rgba(0,0,0,.22)";
    const inv = p.dark ? "" : ' style="filter:invert(1)"';
    const body = p.type === "tee"
      ? `<path d="${TEE}" fill="${p.color}"/><path d="${TEE}" fill="url(#shade)"/>
         <path d="M106 32 Q120 56 134 32" fill="none" stroke="${line}" stroke-width="5" stroke-linecap="round"/>
         <path d="M76 97 L88 42 M164 97 L152 42 M76 198 H164" fill="none" stroke="${line}" stroke-width="1.5"/>
         <use href="#lg" x="88" y="86" width="64" height="11.2"${inv}/>`
      : `<path d="${HOODIE}" fill="${p.color}"/><path d="${HOODIE}" fill="url(#shade)"/>
         <path d="M92 41 Q120 82 148 41 Q120 22 92 41Z" fill="rgba(0,0,0,.4)"/>
         <path d="M110 70 V100 M130 70 V100" fill="none" stroke="${line}" stroke-width="3" stroke-linecap="round"/>
         <path d="M84 166 H156 L164 202 H76 Z M56 206 H184" fill="none" stroke="${line}" stroke-width="1.5" stroke-linejoin="round"/>
         <use href="#lg" x="88" y="116" width="64" height="11.2"${inv}/>`;
    return `<svg viewBox="0 0 240 240" role="img" aria-label="${p.name}">${body}</svg>`;
  }

  const chosen = {};
  const grid = document.getElementById("grid");

  grid.innerHTML = products.map(p => `
    <article class="card">
      <div class="art"${p.bg ? ` style="background:${p.bg}"` : ""}>${art(p)}</div>
      <div class="info">
        <div class="row"><span class="name">${p.name}</span><span class="price">${p.price} kr</span></div>
        <div>
          <div class="label">Storlek (längd i cm)</div>
          <div class="sizes" role="group" aria-label="Storlek för ${p.name}">
            ${SIZES.map(s => `<button class="size" data-id="${p.id}" data-size="${s}" aria-pressed="${s === DEFAULT_SIZE}">${s}</button>`).join("")}
          </div>
        </div>
        <button class="btn buy" data-buy="${p.id}">Beställ</button>
      </div>
    </article>`).join("");

  grid.addEventListener("click", e => {
    const sizeBtn = e.target.closest(".size");
    if (sizeBtn){
      chosen[sizeBtn.dataset.id] = sizeBtn.dataset.size;
      sizeBtn.parentElement.querySelectorAll(".size").forEach(b => b.setAttribute("aria-pressed", b === sizeBtn));
      return;
    }
    const buy = e.target.closest(".buy");
    if (buy){
      const p = products.find(x => x.id === buy.dataset.buy);
      const size = chosen[p.id] || DEFAULT_SIZE;
      const subject = `Beställning: ${p.name}, storlek ${size}`;
      const body = `Hej MCRV!\n\nJag vill beställa:\n${p.name}, storlek ${size}, ${p.price} kr\n\nMitt namn:\nMin adress:\n`;
      window.location.href = `mailto:${CONFIG.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }
  });

  const mail = document.getElementById("mail");
  mail.href = "mailto:" + CONFIG.email;
  mail.textContent = CONFIG.email;
  document.getElementById("insta").href = CONFIG.instagram;
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
